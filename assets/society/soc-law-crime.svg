<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Как различать уголовные наказания</title>
  <desc id="desc">Схема-маркер: уголовные наказания назначаются только судом по УК РФ; рядом примеры мер других отраслей для разведения.</desc>
  <rect width="640" height="420" rx="10" fill="#ffffff"/>
  <text x="20" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Как различать уголовные наказания</text>
  <text x="20" y="56" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Маркеры: только суд, только УК РФ, только за преступление</text>
  <rect x="20" y="76" width="290" height="230" rx="10" fill="none" stroke="#0284c7" stroke-width="3"/>
  <text x="36" y="108" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0284c7">Уголовные (УК РФ)</text>
  <text x="36" y="136" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">обязательные работы</text>
  <text x="36" y="164" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">арест</text>
  <text x="36" y="192" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">лишение свободы</text>
  <text x="36" y="220" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">пожизненное лишение свободы</text>
  <text x="36" y="248" font-family="Arial, sans-serif" font-size="14" fill="#64748b">назначает только суд</text>
  <text x="36" y="272" font-family="Arial, sans-serif" font-size="14" fill="#64748b">только за преступление</text>
  <rect x="330" y="76" width="290" height="230" rx="10" fill="none" stroke="#b45309" stroke-width="3"/>
  <text x="346" y="108" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b45309">Не уголовные меры</text>
  <text x="346" y="136" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">выговор — дисциплинарная</text>
  <text x="346" y="164" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">предупреждение — админ.</text>
  <text x="346" y="192" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">пени — гражданско-правовая</text>
  <text x="346" y="248" font-family="Arial, sans-serif" font-size="14" fill="#64748b">смотри на кодекс,</text>
  <text x="346" y="272" font-family="Arial, sans-serif" font-size="14" fill="#64748b">а не на строгость меры</text>
  <rect x="20" y="322" width="600" height="40" rx="8" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="36" y="348" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#059669">Правило: строгое ≠ уголовное. Проверяй каждую меру по кодексу.</text>
  <text x="20" y="404" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Иллюстрация: разводящие маркеры уголовных и иных мер</text>
</svg>
