<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Как различать административные наказания</title>
  <desc id="desc">Схема-маркер: административные наказания назначаются по КоАП РФ за проступок; рядом примеры мер других отраслей для разведения.</desc>
  <rect width="640" height="420" rx="10" fill="#ffffff"/>
  <text x="20" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Как различать административные наказания</text>
  <text x="20" y="56" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Маркеры: КоАП РФ, проступок, суд или должностные лица</text>
  <rect x="20" y="76" width="290" height="230" rx="10" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="36" y="108" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7c3aed">Административные (КоАП)</text>
  <text x="36" y="136" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">дисквалификация</text>
  <text x="36" y="164" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">выдворение за пределы РФ</text>
  <text x="36" y="192" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">обязательные работы (КоАП)</text>
  <text x="36" y="248" font-family="Arial, sans-serif" font-size="14" fill="#64748b">назначаются за проступок,</text>
  <text x="36" y="272" font-family="Arial, sans-serif" font-size="14" fill="#64748b">а не за преступление</text>
  <rect x="330" y="76" width="290" height="230" rx="10" fill="none" stroke="#b45309" stroke-width="3"/>
  <text x="346" y="108" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b45309">Не административные</text>
  <text x="346" y="136" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">выговор — дисциплинарная</text>
  <text x="346" y="164" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">исправительные работы — угол.</text>
  <text x="346" y="192" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">возмещение убытков — гражд.</text>
  <text x="346" y="248" font-family="Arial, sans-serif" font-size="14" fill="#64748b">одно название в разных</text>
  <text x="346" y="272" font-family="Arial, sans-serif" font-size="14" fill="#64748b">кодексах — разные меры</text>
  <rect x="20" y="322" width="600" height="40" rx="8" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="36" y="348" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#059669">Правило: название ≠ отрасль. Смотри, по какому кодексу мера.</text>
  <text x="20" y="404" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Иллюстрация: разводящие маркеры административных и иных мер</text>
</svg>
