<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Схема цветка</title>
  <desc id="desc">Лепестки, тычинка с пыльником, пестик с завязью, чашелистик.</desc>
  <rect width="640" height="420" rx="10" fill="#111827"/>
  <ellipse cx="320" cy="120" rx="34" ry="60" fill="none" stroke="#f472b6" stroke-width="3"/>
  <ellipse cx="230" cy="160" rx="60" ry="30" fill="none" stroke="#f472b6" stroke-width="3"/>
  <ellipse cx="410" cy="160" rx="60" ry="30" fill="none" stroke="#f472b6" stroke-width="3"/>
  <path d="M320,200 L320,300" stroke="#34d399" stroke-width="4"/>
  <circle cx="320" cy="200" r="14" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="270" cy="185" r="12" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="370" cy="185" r="12" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="200" y="120" font-family="Arial, sans-serif" font-size="15"  fill="#e2e8f0">лепесток</text>
  <text x="345" y="195" font-family="Arial, sans-serif" font-size="15"  fill="#e2e8f0">пестик</text>
  <text x="395" y="190" font-family="Arial, sans-serif" font-size="15"  fill="#e2e8f0">тычинка</text>

  <path d="M250,330 q70,30 140,0" stroke="#34d399" stroke-width="3" fill="none"/>
  <text x="285" y="365" font-family="Arial, sans-serif" font-size="14"  fill="#94a3b8">чашелистик</text>
  <text x="20" y="404" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Иллюстрация: строение цветка (схема)</text>
</svg>
