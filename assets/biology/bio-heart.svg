<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Схема сердца человека</title>
  <desc id="desc">Четыре камеры: правое и левое предсердия, правый и левый желудочки; аорта.</desc>
  <rect width="640" height="420" rx="10" fill="#111827"/>
  <rect x="150" y="80" width="130" height="100" rx="12" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <rect x="360" y="80" width="130" height="100" rx="12" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <rect x="150" y="200" width="130" height="130" rx="12" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <rect x="360" y="200" width="130" height="130" rx="12" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="160" y="135" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">ПП</text>
  <text x="370" y="135" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">ЛП</text>
  <text x="160" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">ПЖ</text>
  <text x="370" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">ЛЖ</text>

  <path d="M410,80 q-10,-50 60,-45 q60,5 55,60" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <text x="490" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">аорта</text>
  <text x="150" y="365" font-family="Arial, sans-serif" font-size="14"  fill="#94a3b8">ПП — правое предсердие, ЛЖ — левый желудочек</text>
  <text x="20" y="404" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Иллюстрация: камеры сердца и аорта (схема)</text>
</svg>
