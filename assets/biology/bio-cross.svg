<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Схема моногибридного скрещивания Аа × Аа</title>
  <desc id="desc">Решётка Пеннета: гаметы A и a, потомство AA, Aa, Aa, aa.</desc>
  <rect width="640" height="420" rx="10" fill="#ffffff"/>
  <text x="120" y="90" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#b45309">A</text>
  <text x="280" y="90" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#b45309">a</text>
  <text x="30" y="180" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#b45309">A</text>
  <text x="30" y="300" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#b45309">a</text>
  <rect x="90" y="110" width="170" height="110" rx="8" fill="none" stroke="#0284c7" stroke-width="3"/>
  <rect x="280" y="110" width="170" height="110" rx="8" fill="none" stroke="#0284c7" stroke-width="3"/>
  <rect x="90" y="235" width="170" height="110" rx="8" fill="none" stroke="#0284c7" stroke-width="3"/>
  <rect x="280" y="235" width="170" height="110" rx="8" fill="none" stroke="#db2777" stroke-width="3"/>
  <text x="160" y="175" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e293b">АА</text>
  <text x="350" y="175" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e293b">Аа</text>
  <text x="160" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e293b">Аа</text>
  <text x="350" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e293b">аа</text>
  <text x="470" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e293b">3 : 1</text>
  <text x="20" y="404" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Иллюстрация: решётка Пеннета для скрещивания Аа × Аа</text>
</svg>
