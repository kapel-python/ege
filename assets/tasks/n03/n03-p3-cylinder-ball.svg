<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Цилиндр, описанный около шара</title>
  <desc id="desc">Схема: шар касается обоих оснований и боковой поверхности цилиндра (высота цилиндра равна диаметру шара).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="640" height="420" rx="10" fill="#111827"/>
  <ellipse cx="320" cy="90" rx="130" ry="34" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <ellipse cx="320" cy="330" rx="130" ry="34" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M190.0,90.0L190.0,330.0" stroke="#38bdf8" stroke-width="3"/>
  <path d="M450.0,90.0L450.0,330.0" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="320" cy="210.0" r="120.0" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="20" y="404" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Иллюстрация: диаметр шара равен высоте цилиндра и диаметру основания</text>
</svg>
