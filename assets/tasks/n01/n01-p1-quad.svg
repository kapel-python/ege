<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Четырёхугольник ABCD с вписанной окружностью</title>
  <desc id="desc">Схема: вписанная окружность касается всех четырёх сторон четырёхугольника ABCD.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="640" height="420" rx="10" fill="#111827"/>
  <circle cx="320" cy="220" r="95" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M198.9,135.2 L406.4,117.1 L419.9,272.0 L260.3,364.2 Z" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="198.9" cy="135.2" r="4" fill="#f8fafc"/>
  <text x="172.9" y="123.2" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">B</text>
  <circle cx="406.4" cy="117.1" r="4" fill="#f8fafc"/>
  <text x="420.4" y="105.1" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">C</text>
  <circle cx="419.9" cy="272.0" r="4" fill="#f8fafc"/>
  <text x="433.9" y="296.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">D</text>
  <circle cx="260.3" cy="364.2" r="4" fill="#f8fafc"/>
  <text x="234.3" y="388.2" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">A</text>
  <text x="20" y="404" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Иллюстрация: окружность вписана в ABCD (касается AB, BC, CD, DA)</text>
</svg>
