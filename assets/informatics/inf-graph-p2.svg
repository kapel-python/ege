<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">Схема дорог: пункты A–H</title>
  <desc id="d">Вершины — пункты A–H, рёбра — дороги между ними; протяжённости приведены в таблице условия.</desc>
  <rect width="640" height="420" fill="#ffffff"/>
  <line x1="110" y1="180" x2="230" y2="60" stroke="#64748b" stroke-width="2.5"/>
