  <circle cx="300" cy="360" r="17" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
  <text x="300" y="365" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">G</text>
  <circle cx="110" cy="320" r="17" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
  <text x="110" y="325" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">F</text>
  <circle cx="360" cy="180" r="17" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
  <text x="360" y="185" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">E</text>
