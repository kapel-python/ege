  <circle cx="110" cy="180" r="17" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
  <text x="110" y="185" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">A</text>
  <circle cx="230" cy="60" r="17" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
  <text x="230" y="65" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">B</text>
  <circle cx="400" cy="60" r="17" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
  <text x="400" y="65" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">C</text>
  <circle cx="540" cy="130" r="17" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
  <text x="540" y="135" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">D</text>
  <circle cx="520" cy="320" r="17" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
