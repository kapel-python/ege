  <line x1="400" y1="60" x2="540" y2="130" stroke="#64748b" stroke-width="2.5"/>
  <line x1="540" y1="130" x2="520" y2="320" stroke="#64748b" stroke-width="2.5"/>
  <line x1="520" y1="320" x2="300" y2="360" stroke="#64748b" stroke-width="2.5"/>
