<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">Схема базы данных: две таблицы</title>
  <desc id="d">Поля таблиц и связь между ними</desc>
  <rect width="640" height="420" fill="#ffffff"/>
  <rect x="40" y="40" width="240" height="100" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="40" y="40" width="240" height="30" rx="8" fill="#0284c7"/>
  <text x="160" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Рейсы</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">номер: TEXT (ключ)</text>
  <text x="52" y="110" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">город: TEXT</text>
  <text x="52" y="132" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">время: TEXT</text>
  <rect x="40" y="166" width="240" height="100" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="40" y="166" width="240" height="30" rx="8" fill="#0284c7"/>
  <text x="160" y="186" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Билеты</text>
  <text x="52" y="214" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">рейс: TEXT</text>
  <text x="52" y="236" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">место: INTEGER</text>
  <text x="52" y="258" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">цена: REAL</text>
  <text x="320" y="408" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">№3: сначала отбор рейсов, потом билеты по «рейс»</text>
</svg>