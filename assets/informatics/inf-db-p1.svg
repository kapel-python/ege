<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">Схема базы данных: две таблицы</title>
  <desc id="d">Поля таблиц и связь между ними</desc>
  <rect width="640" height="420" fill="#ffffff"/>
  <rect x="40" y="40" width="240" height="122" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="40" y="40" width="240" height="30" rx="8" fill="#0284c7"/>
  <text x="160" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Товары</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">id: INTEGER (ключ)</text>
  <text x="52" y="110" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">название: TEXT</text>
  <text x="52" y="132" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">цена: REAL</text>
  <text x="52" y="154" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">производитель: TEXT</text>
  <rect x="40" y="188" width="240" height="100" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="40" y="188" width="240" height="30" rx="8" fill="#0284c7"/>
  <text x="160" y="208" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Производители</text>
  <text x="52" y="236" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">название: TEXT (ключ)</text>
  <text x="52" y="258" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">регион: TEXT</text>
  <text x="52" y="280" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">телефон: TEXT</text>
  <text x="320" y="408" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">№3: связь по полю «производитель» → «название»</text>
</svg>