<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">Схема базы данных: две таблицы</title>
  <desc id="d">Поля таблиц и связь между ними</desc>
  <rect width="640" height="420" fill="#ffffff"/>
  <rect x="40" y="40" width="240" height="100" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="40" y="40" width="240" height="30" rx="8" fill="#0284c7"/>
  <text x="160" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Сотрудники</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">id: INTEGER (ключ)</text>
  <text x="52" y="110" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">имя: TEXT</text>
  <text x="52" y="132" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">отдел: TEXT</text>
  <rect x="40" y="166" width="240" height="78" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="40" y="166" width="240" height="30" rx="8" fill="#0284c7"/>
  <text x="160" y="186" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Отделы</text>
  <text x="52" y="214" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">название: TEXT (ключ)</text>
  <text x="52" y="236" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">этаж: INTEGER</text>
  <text x="320" y="408" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">№3: соединение по «отдел» → «название»</text>
</svg>