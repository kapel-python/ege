<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Новости — lemma go</title>
<meta name="description" content="Новости lemma go: обновления платформы, новые предметы и важные изменения.">
<link rel="canonical" href="https://lemmago.ru/news">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F5FA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#05070C">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="lemma go">
<meta property="og:title" content="Новости — lemma go">
<meta property="og:description" content="Обновления платформы, новые предметы и важные изменения.">
<meta property="og:url" content="https://lemmago.ru/news">
<meta property="og:image" content="https://lemmago.ru/assets/seo/og-image.png">
<script>
(function(){
  try{
    var saved=null;
    try{saved=localStorage.getItem('ege_core_theme');}catch(e){}
    var theme=(saved==='light'||saved==='dark')?saved:((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
    document.documentElement.setAttribute('data-theme',theme);
  }catch(e){}
})();
</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="css/footer.css?v=8">
<link rel="stylesheet" href="/css/site-reveal.css?v=1">
<script>document.documentElement.classList.add('js');</script>
<style>
:root,:root[data-theme="light"]{
  --surface-0:#F3F5FA;--surface-1:#fff;--surface-2:#fff;
  --text:#0E1526;--text-dim:#48536B;--text-faint:#5B6579;
  --accent:#0277B6;--accent-dim:rgba(2,119,182,.10);--green:#15803d;
  --header-bg:rgba(255,255,255,.85);--hairline:rgba(15,23,42,.08);
  --card-border:rgba(15,23,42,.10);--card-border-hover:rgba(15,23,42,.20);
  --ghost-ring:rgba(15,23,42,.18);--muted-bg:rgba(15,23,42,.06);
  --radius-lg:20px;--radius-md:14px;
  --font-body:'Inter',-apple-system,system-ui,sans-serif;
  --font-display:'Manrope',var(--font-body);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
:root[data-theme="dark"]{
  --surface-0:#05070C;--surface-1:#0A0D12;--surface-2:#0F131C;
  --text:#F8F9FB;--text-dim:#A0A6B8;--text-faint:#666D82;
  --accent:#38BDF8;--accent-dim:rgba(56,189,248,.15);--green:#6EE7B7;
  --header-bg:rgba(5,7,12,.85);--hairline:rgba(255,255,255,.06);
  --card-border:rgba(255,255,255,.08);--card-border-hover:rgba(255,255,255,.14);
  --ghost-ring:rgba(255,255,255,.12);--muted-bg:rgba(255,255,255,.06);
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--surface-0);color:var(--text);font-family:var(--font-body);line-height:1.6;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:860px;margin:0 auto;padding:0 clamp(20px,4vw,32px);}
.hero{padding:clamp(48px,8vw,84px) 0 clamp(20px,4vw,32px);}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;}
h1{font-family:var(--font-display);font-size:clamp(30px,6vw,46px);line-height:1.15;letter-spacing:-.02em;margin:0 0 12px;}
.lead{color:var(--text-dim);font-size:clamp(15px,2vw,18px);margin:0;}
.news-list{display:grid;gap:14px;padding:18px 0 60px;}
.news-card{background:var(--surface-2);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:clamp(18px,3vw,26px);transition:border-color .3s var(--ease-out),transform .3s var(--ease-out);cursor:pointer;}
.news-card:hover{border-color:var(--card-border-hover);transform:translateY(-2px);}
.news-card__date{font-size:13px;color:var(--text-faint);margin-bottom:6px;}
.news-card__title{font-family:var(--font-display);font-size:clamp(18px,2.6vw,22px);font-weight:700;margin:0 0 8px;letter-spacing:-.01em;}
.news-card__preview{color:var(--text-dim);font-size:15px;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.news-card__more{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-weight:600;font-size:14px;color:var(--accent);}
.news-empty{background:var(--surface-2);border:1px dashed var(--card-border);border-radius:var(--radius-lg);padding:40px 24px;text-align:center;color:var(--text-dim);}
.news-detail{background:var(--surface-2);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:clamp(22px,4vw,36px);margin:18px 0 60px;}
.news-detail__back{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--accent);margin-bottom:16px;cursor:pointer;background:none;border:none;padding:0;font:inherit;}
.news-detail h1{font-size:clamp(24px,5vw,34px);}
.news-body{font-size:16px;line-height:1.75;color:var(--text);}
.news-body p{margin:0 0 14px;}
.news-body h2{font-family:var(--font-display);font-size:22px;margin:26px 0 12px;letter-spacing:-.01em;}
.news-body h3{font-family:var(--font-display);font-size:18px;margin:22px 0 10px;}
.news-body ul,.news-body ol{margin:0 0 14px;padding-left:24px;}
.news-body li{margin:4px 0;}
.news-body blockquote{margin:0 0 14px;padding:12px 16px;border-left:3px solid var(--accent);background:var(--accent-dim);border-radius:0 12px 12px 0;}
.news-body blockquote p{margin:0;}
.news-body pre{background:var(--muted-bg);border-radius:12px;padding:14px 16px;overflow-x:auto;font-size:14px;margin:0 0 14px;}
.news-body code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;}
.news-body a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;}
.news-body hr{border:none;border-top:1px solid var(--card-border);margin:22px 0;}
.news-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 14px;}
@media(max-width:640px){.news-cols{grid-template-columns:1fr;}}
.news-err{background:var(--surface-2);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:32px 24px;text-align:center;color:var(--text-dim);margin:18px 0 60px;}
.skel{background:var(--surface-2);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:24px;min-height:120px;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.6;}50%{opacity:1;}}
@media(prefers-reduced-motion:reduce){.skel{animation:none;}}
</style>
</head>
<body>
<div data-glass-header></div>
<main class="wrap">
  <div class="hero">
    <span class="eyebrow">lemma go · обновления</span>
    <h1 id="pageTitle">Новости</h1>
    <p class="lead" id="pageLead">Обновления платформы, новые предметы и важные изменения — всё в одном месте.</p>
  </div>
  <div id="newsRoot"><div class="skel">Загружаем новости…</div></div>
</main>
<div data-ege-footer></div>
<script src="/js/glass-header.js?v=4"></script>
<script src="js/footer.js?v=9"></script>
<script src="/js/site-reveal.js?v=1"></script>
<script>
(function(){
  "use strict";
  var root = document.getElementById("newsRoot");
  var titleEl = document.getElementById("pageTitle");
  var leadEl = document.getElementById("pageLead");
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function fmtDate(ms){
    try{
      var d=new Date(Number(ms));
      if(isNaN(d.getTime())) return "";
      return d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
    }catch(e){return "";}
  }
  function currentId(){
    try{
      var u=new URL(location.href);
      var v=u.searchParams.get("id");
      if(v && /^\d+$/.test(v)) return v;
    }catch(e){}
    return null;
  }
  function renderList(items){
    if(!items.length){
      root.innerHTML='<div class="news-empty">Пока новостей нет — загляни позже.</div>';
      return;
    }
    root.innerHTML='<div class="news-list">'+items.map(function(n){
      return '<article class="news-card" data-id="'+Number(n.id)+'" tabindex="0" role="link" aria-label="'+esc(n.title)+'">'
        +'<div class="news-card__date">'+esc(fmtDate(n.createdAt))+'</div>'
        +'<h2 class="news-card__title">'+esc(n.title)+'</h2>'
        +'<p class="news-card__preview">'+esc(n.preview||"")+'</p>'
        +'<span class="news-card__more">Читать →</span>'
        +'</article>';
    }).join("")+'</div>';
    root.querySelectorAll(".news-card").forEach(function(card){
      function open(){location.href="/news?id="+card.getAttribute("data-id");}
      card.addEventListener("click",open);
      card.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
    });
  }
  async function loadList(){
    titleEl.textContent="Новости";
    leadEl.textContent="Обновления платформы, новые предметы и важные изменения — всё в одном месте.";
    document.title="Новости — lemma go";
    var res=await fetch("/api/news",{credentials:"same-origin"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    var data=await res.json();
    renderList(data.news||[]);
  }
  async function loadOne(id){
    var res=await fetch("/api/news/"+encodeURIComponent(id),{credentials:"same-origin"});
    if(res.status===404){
      titleEl.textContent="Новости";
      root.innerHTML='<div class="news-err">Новость не найдена. Возможно, её удалили.<br><br><a href="/news" style="color:var(--accent);font-weight:600;">← Все новости</a></div>';
      return;
    }
    if(!res.ok) throw new Error("HTTP "+res.status);
    var data=await res.json();
    var n=data.news;
    titleEl.textContent=n.title;
    leadEl.textContent=fmtDate(n.createdAt);
    document.title=n.title+" — Новости lemma go";
    // bodyHtml уже прошёл allowlist-санитайзер на сервере — вставляем как есть.
    root.innerHTML='<article class="news-detail"><button class="news-detail__back" id="backBtn">← Все новости</button>'
      +'<h1>'+esc(n.title)+'</h1>'
      +'<div class="news-body">'+(n.bodyHtml||"")+'</div></article>';
    document.getElementById("backBtn").onclick=function(){location.href="/news";};
  }
  async function boot(){
    try{
      var id=currentId();
      if(id) await loadOne(id);
      else await loadList();
    }catch(e){
      root.innerHTML='<div class="news-err">Не получилось загрузить новости. Проверь соединение и обнови страницу.</div>';
    }
  }
  window.addEventListener("popstate",boot);
  boot();
})();
</script>
</body>
</html>
