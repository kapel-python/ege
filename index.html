<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ege easy — подготовка к ЕГЭ по математике</title>
<meta name="description" content="Платформа подготовки к ЕГЭ по математике (профиль и база) с системой прогресса: уровни, XP, миссии, навыки, боссы.">
<link rel="canonical" href="/">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F5FA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#05070C">
<script>
  /* Saved choice wins; on the first visit (no saved value) follow the device
     theme, so the onboarding/diagnostic screens never force light mode.
     Runs before styles paint to avoid a theme flash. */
  try {
    var savedTheme = localStorage.getItem("ege_core_theme");
    if (savedTheme === "dark") {
      document.documentElement.dataset.theme = "dark";
    } else if (!savedTheme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      document.documentElement.dataset.theme = "dark";
    }
  } catch (e) {}
</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/seo/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="css/styles.css?v=33">
<link rel="stylesheet" href="css/lesson.css?v=4">
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__logo sidebar__logo--easy">
      <span class="easy-badge"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 13.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="easy-name">ege <em>easy</em></span>
      <span class="logo-sub">математика без стресса</span>
    </div>
    <nav class="sidebar__nav" id="sidebarNav"></nav>
    <div class="sidebar__footer" id="sidebarFooter"></div>
  </aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="screen" id="screen"></main>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div id="modal-root"></div>
<div id="device-modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<!-- data/state/app — критический путь первого экрана (defer сохраняет порядок).
     katex + jsxgraph + mathvisual (~1.2 МБ) грузятся лениво через Vendor.ensureMath()
     только на экранах с заданиями; их CSS инжектится туда же. -->
<script defer src="js/data.js?v=5"></script>
<script defer src="js/state.js?v=15"></script>
<script defer src="js/app.js?v=47"></script>
</body>
</html>
