<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EGE CORE — подготовка к профильной математике</title>
<meta name="description" content="Платформа подготовки к ЕГЭ по профильной математике с системой прогресса: уровни, XP, миссии, навыки, боссы.">
<script>
  /* Apply the saved choice before styles are painted, so navigation and reloads
     never briefly show the opposite theme. */
  try {
    if (localStorage.getItem("ege_core_theme") === "dark") {
      document.documentElement.dataset.theme = "dark";
    }
  } catch (e) {}
</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d7cff'/%3E%3Ctext x='16' y='22' font-family='Arial,Helvetica,sans-serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3EEG%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css?v=2">
<link rel="stylesheet" href="css/lesson.css?v=2">
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__logo">
      <span class="logo-mark">EGE</span><span class="logo-text">CORE</span>
      <span class="logo-sub">профильная математика</span>
    </div>
    <nav class="sidebar__nav" id="sidebarNav"></nav>
    <div class="sidebar__footer" id="sidebarFooter"></div>
  </aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="screen" id="screen"></main>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<!-- data/state/app — критический путь первого экрана (defer сохраняет порядок).
     katex + jsxgraph + mathvisual (~1.2 МБ) грузятся лениво через Vendor.ensureMath()
     только на экранах с заданиями; их CSS инжектится туда же. -->
<script defer src="js/data.js?v=3"></script>
<script defer src="js/state.js?v=3"></script>
<script defer src="js/app.js?v=3"></script>
</body>
</html>
